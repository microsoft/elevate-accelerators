name: Feature request
description: Suggest an improvement to an existing accelerator.
labels: [enhancement]
body:
  - type: input
    id: accelerator
    attributes:
      label: Accelerator
      description: Path of the accelerator, for example education/education-analytics.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Who needs this and what problem does it solve?
